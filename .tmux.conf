# My Tmux config
# largely inspired by Brian Hogan's book: "tmux: Production Mouse-Free Development"

# Change prefix and allow nested-prefix
set -g prefix C-s
bind C-s send-prefix

# Vi keys for copy mode
setw -g mode-keys vi

set -g status-interval 60

# Increase scrollback buffer size
set -g history-limit 4096
# Enable true color (24-bit) support
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:Tc"

# Forward OSC 8 hyperlinks to Ghostty. tmux parses and stores them either way,
# but only re-emits them when the attached client's terminal advertises the
# capability -- xterm-ghostty's terminfo does not, so tmux was silently
# stripping every hyperlink. Takes effect on a fresh client attach.
set -as terminal-features ",xterm-ghostty:hyperlinks"

set -g default-shell "/bin/zsh"

# Shorten delay
set -s escape-time 1

# Set window and pane numbering to be 1 indexed
set -g base-index 1
setw -g pane-base-index 1
# Renumber windows after closing any of them
set -g renumber-windows on

# Conditionally load mac specific configuration
if-shell 'test "$(uname)" = "Darwin"' 'source ~/.tmux-osx.conf'

# Conditionally load the bindings that let tmux be driven from inside a herdr
# pane, where herdr intercepts ctrl+s and ctrl+h/j/k/l. $HERDR_ENV is herdr's
# $TMUX. See ~/.tmux-herdr.conf for the caveat about which server this loads in.
if-shell '[ -n "$HERDR_ENV" ]' 'source ~/.tmux-herdr.conf'

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded"

# Splitting
bind - split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
# To avoid inconsistency with shifting when splitting
bind \\ split-window -h -c '#{pane_current_path}'

# Create a new window
bind c new-window -c '#{pane_current_path}'

# Break the current pane out into its own window
bind b break-pane

# Prefix-free pane switching. tmux swallows these rather than forwarding them
# to Vim, so use `<C-w>h` and friends for windows inside a pane. herdr's
# focus_pane_* bindings match.
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R
bind-key -n C-\\ select-pane -l

# Allow C-l to clear terminal
bind C-l send-keys "C-l"

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status bar
# Prevent session names from being truncated
set -g status-left-length 40
set-option -g status-right "%Y-%m-%d %R"

# Status bar colours
set-option -g status-style "bg=black,fg=yellow"

# Window title colours
set-window-option -g window-status-style "fg=brightblue,bg=default"

# Active window title colours
set-window-option -g window-status-current-style "fg=brightred,bg=default"

# Pane border — heavy lines so the active pane is obvious at a glance
set-option -g pane-border-lines heavy
set-option -g pane-border-indicators both
set-option -g pane-border-style "fg=colour238"
set-option -g pane-active-border-style "fg=brightgreen,bold"

# Message text
set-option -g message-style "bg=black,fg=brightred"

# Pane number display
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour brightred

# Visual bell — highlight windows that need attention
set-option -g visual-bell off
set-option -g monitor-bell on
set-option -g window-status-bell-style 'fg=colour235,bg=colour214,bold'

# The most important feature of tmux: the clock
set-window-option -g clock-mode-colour green

# Pass focus events through to applications running inside tmux
set -g focus-events on
# Enable mouse support for scrolling, pane selection, and resize
set -g mouse on
# Allow terminal escape sequences to pass through to the outer terminal
set -g allow-passthrough on

# Allow tmux to recognize extended key sequences (e.g. Shift+Enter).
# Use the 'xterm' (modifyOtherKeys) format, not 'csi-u': with csi-u, tmux
# re-encodes control characters inside bracketed paste, so a newline
# (LF = Ctrl-J) becomes `ESC [ 106 ; 5 u` and degrades to a stray `j` at the
# end of every pasted line on terminals that advertise CSI-u support (e.g.
# Ghostty). The xterm format keeps extended keys working without that bug.
set -s extended-keys on
set -s extended-keys-format xterm

# Coding agents report their state with OSC 7501 (tmux 3.9+), which tmux keeps
# per pane in #{pane_program_state}. One glyph per pane and per window, in
# priority order: blocked, then a turn that finished while hidden
# (@agent_unseen, set by drover), then working.
set -g @agent_pane_glyph '#{?#{==:#{pane_program_state},blocked},#[fg=colour208]!,#{?@agent_unseen,#[fg=colour106]✓,#{?#{==:#{pane_program_state},working},#[fg=colour33]●,#[fg=colour245]○}}}#[default]'
set -g @agent_window_glyph '#{?#{P:#{?#{==:#{pane_program_state},blocked},1,}},#[fg=colour208]!#[default],#{?#{P:#{?@agent_unseen,1,}},#[fg=colour106]✓#[default],#{?#{P:#{?#{==:#{pane_program_state},working},1,}},#[fg=colour33]●#[default],}}}'
setw -g window-status-format '#I:#W#{?window_flags,#{window_flags}, }#{E:@agent_window_glyph}'
setw -g window-status-current-format '#I:#W#{?window_flags,#{window_flags}, }#{E:@agent_window_glyph}'

# A second status row lists every agent in every session. Clicking an entry
# jumps to its pane through the default MouseDown1Status binding. Titles are
# agent-controlled, so q/h escapes any # before the status line sees it.
set -g @agent_entry '#[range=pane|#{pane_id}]#{E:@agent_pane_glyph} #{window_name} · #{s/^OC [|] //:#{q/h:pane_title}}#[norange]  '
set -g status 2
set -g status-format[1] '#{S:#{W:#{P:#{?pane_program_state,#{E:@agent_entry},}}}}'
