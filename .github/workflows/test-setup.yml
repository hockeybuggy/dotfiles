name: Test setup.sh

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [minimal, work, personal]
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify ${{ matrix.mode }} in a clean Debian container
        run: ./test/run.sh --mode "${{ matrix.mode }}"

  test-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify macOS tools
        run: |
          export TERM=xterm
          ./test/setup-script-name.sh
          ./bootstrap.sh --personal
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.local/share/fnm:$PATH"
          export EDITOR=nvim
          ./test/verify.sh --mode personal
          ./doctor.sh --ci
