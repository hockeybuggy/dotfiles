# herdr configuration -- linked to ~/.config/herdr/config.toml by bootstrap.sh.
#
# Only the settings that differ from herdr's defaults live here; run
# `herdr --default-config` to see everything available, and reload with
# `herdr server reload-config` or prefix+r after editing.
#
# Note that herdr keeps its logs, sockets and session state in the same
# directory as this file. Only config.toml is tracked here; the rest is local
# state and stays out of the repo.
#
# herdr ignores unknown keys and unparseable bindings *silently* -- a typo
# doesn't fail to load, it just quietly does nothing. Verify a binding by
# pressing it rather than by a clean startup.

[terminal]
# Match .tmux.conf's `default-shell`: panes should always start zsh, whatever
# $SHELL happens to be for the process that launched the server.
default_shell = "/bin/zsh"

[ui]
# herdr puts the tab bar on top; tmux's status line sits at the bottom, which is
# where years of muscle memory expects to find the window list. Prefix, navigate,
# copy and resize modes borrow this row for their own status bars.
tab_bar_position = "bottom"

# Default 3, which combined with Ghostty's discrete wheel multiplier made one
# notch travel roughly nine lines -- easy to leave a pane scrolled up by
# accident. One line per notch here, one event per notch in the Ghostty config.
# Deliberate scrollback reading is prefix+[ or prefix+e, neither affected.
mouse_scroll_lines = 1

# Bindings that pull herdr towards .tmux.conf. Plenty already agree out of the
# box and need nothing here: prefix+minus for a stacked split, prefix+c new
# tab, prefix+p / prefix+n tab cycling, prefix+1..9, prefix+x close pane,
# prefix+z zoom, prefix+? help, and mouse support.
[keys]
# tmux's `set -g prefix C-s`. herdr has no `send-prefix` equivalent, so nesting
# herdr inside tmux leaves both fighting over ctrl+s.
prefix = "ctrl+s"

# tmux binds both `|` and `\` to a side-by-side split; keep herdr's prefix+v
# alongside them.
split_vertical = ["prefix+v", "prefix+|", "prefix+\\"]

# tmux's root-table ctrl+h/j/k/l pane focus, with ctrl+arrows alongside. These
# replace herdr's prefix+h/j/k/l default rather than adding to it -- pane focus
# is frequent enough that the prefix is not worth paying.
#
# herdr intercepts a direct binding before the pane app sees it, so ctrl+h/j/k/l
# no longer reach Vim -- use `<C-w>h` and friends for windows inside a pane.
# Same trade for the shell: ctrl+l no longer clears the screen, so type `clear`.
# tmux keeps prefix+ctrl+l for that; herdr has no send-keys binding to mirror it.
#
# The arrows are deliberately ctrl+arrow and not bare arrow: a bare binding
# would swallow arrow keys in every pane, breaking shell history and cursor
# movement. Nothing in .zshrc binds ctrl+arrow.
focus_pane_left = ["ctrl+h", "ctrl+left"]
focus_pane_down = ["ctrl+j", "ctrl+down"]
focus_pane_up = ["ctrl+k", "ctrl+up"]
focus_pane_right = ["ctrl+l", "ctrl+right"]

# tmux's root-table `C-\` last-pane. Unbound in herdr by default.
last_pane = "ctrl+backslash"

# tmux's prefix+d detach, prefix+, rename, prefix+& kill-window. Note herdr's
# close_tab does not ask for confirmation the way tmux does.
detach = "prefix+d"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"

# tmux's `bind r source-file`. That displaces resize_mode from its prefix+r
# default onto herdr's old reload binding.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux's prefix+s choose-session: workspaces are the nearest thing herdr has to
# sessions, so the picker moves off prefix+w onto prefix+s. That displaces
# settings, which has no tmux counterpart to be faithful to.
workspace_picker = "prefix+s"
settings = "prefix+shift+s"

# No tmux counterpart. previous_agent/next_agent/focus_agent are unbound by
# default; prefix+w is free since workspace_picker moved off it above, and
# prefix+q is free since detach moved off it onto prefix+d. Avoiding [ and ]
# since they're awkward to reach.
next_agent = "prefix+w"
previous_agent = "prefix+q"
focus_agent = "prefix+alt+1..9"

# Unportable from .tmux.conf, for the record:
#
#   - prefix+H/J/K/L resize. herdr binds those to *swap pane* by default and
#     that wins over resize_pane_*, silently. Use resize mode above instead:
#     prefix+shift+r, then h/l for width and j/k for height, esc to finish.
#   - prefix+b break-pane. herdr has no break-pane action; prefix+b stays
#     herdr's sidebar toggle. `herdr pane move <id> --new-tab` does it by hand.
#   - vi copy mode (`mode-keys vi`). herdr is mouse-first for selection and has
#     no vi-keys equivalent; prefix+e opens the scrollback in $EDITOR.

[theme]
name = "catppuccin"
auto_switch = false
