# tmux bindings for running tmux *inside* a herdr pane.
#
# herdr claims ctrl+s as its prefix and binds ctrl+h/j/k/l and ctrl+\ directly,
# intercepting all of them before the pane app sees anything. herdr 0.9.0 has no
# send-prefix or passthrough action, so a tmux nested in a herdr pane is
# unreachable on its usual keys: the prefix never arrives and neither does
# prefix-free pane focus.
#
# This file hands tmux a second set of keys that herdr leaves alone. Everything
# here is additive -- nothing rebinds or unbinds a key .tmux.conf already uses --
# so it is harmless when it loads for a tmux that is not inside herdr.
#
# .tmux.conf sources it when $HERDR_ENV is set. That test runs when the tmux
# *server* starts, and bindings are server-global, so a server first started
# outside herdr will not have loaded this. Run
# `tmux source-file ~/.tmux-herdr.conf` in such a session to pick it up.

# ctrl+a as a second prefix, alongside .tmux.conf's ctrl+s. Once the prefix is
# reachable the rest of the prefix table comes with it, resize and clear-screen
# included. send-prefix -2 keeps the nested-tmux escape working for the new key.
set -g prefix2 C-a
bind C-a send-prefix -2

# Pane focus on alt+h/j/k/l, mirroring .tmux.conf's ctrl+h/j/k/l. Requires
# Ghostty's `macos-option-as-alt = true`, which .config/ghostty/config sets.
#
# These sit in the root table, so like their ctrl equivalents tmux swallows them
# rather than forwarding to Vim. alt+\ mirrors ctrl+\ last-pane.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-\\ select-pane -l
